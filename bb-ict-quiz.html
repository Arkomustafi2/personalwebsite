const ICONS  = ["\ud83d\udcbb", "\ud83c\udf33", "\ud83d\uddc4\ufe0f", "\ud83c\udf10", "\u2699\ufe0f", "\ud83d\udd0c", "\ud83d\udee0\ufe0f", "\u26a1", "\ud83c\udfaf"];
const COLORS = ["#00b4d8", "#06d6a0", "#9d4edd", "#4895ef", "#f77f00", "#ef233c", "#f7c948", "#ff6b6b", "#a8dadc"];
const CATS   = Object.keys(DATA);

// Flatten all questions with metadata
const ALL = [];
CATS.forEach((cat, ci) => {
  DATA[cat].forEach((q, qi) => {
    ALL.push({ ...q, cat, ci, qi, id: ci + '-' + qi });
  });
});

function isMCQ(q) { return Array.isArray(q.opts) && q.opts.length > 0 && q.type !== 'Written'; }
function isWritten(q) { return !isMCQ(q); }

// State
let mode      = 'browse';
let activeCat = 0;
let filter    = 'all';
let searchQ   = '';
let quiz      = null;

// ── Sidebar ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function buildSidebar() {
  document.getElementById('btn-browse').className = 'mode-btn' + (mode === 'browse' ? ' active' : '');
  document.getElementById('btn-quiz').className   = 'mode-btn' + (mode === 'quiz'   ? ' active' : '');
  document.getElementById('cat-list').innerHTML = CATS.map((cat, i) => {
    const active = (i === activeCat && searchQ.length < 2) ? ' active' : '';
    const border = active ? `border-right: 3px solid ${COLORS[i]};` : '';
    return `<button class="cat-btn${active}" style="${border}" onclick="selectCat(${i})">
      ${ICONS[i]} ${cat.replace(/^\d+\.\s*/, '')}
      <span class="cnt">${DATA[cat].length}</span>
    </button>`;
  }).join('');
}

function selectCat(i) {
  activeCat = i; filter = 'all'; searchQ = '';
  document.getElementById('search-inp').value = '';
  buildSidebar(); render(); closeSidebar();
}

// ── Mode ──
function setMode(m) {
  mode = m; buildSidebar();
  document.getElementById('browse-view').style.display = m === 'browse' ? 'block' : 'none';
  document.getElementById('quiz-view').style.display   = m === 'quiz'   ? 'block' : 'none';
  if (m === 'quiz') startQuiz(); else renderBrowse();
}

// ── Search ──
function onSearch() {
  searchQ = document.getElementById('search-inp').value.toLowerCase();
  if (searchQ.length > 1) activeCat = -1;
  buildSidebar(); renderBrowse();
}

// ── Render ──
function render() { if (mode === 'browse') renderBrowse(); }

function getQs() {
  let qs = searchQ.length > 1
    ? ALL.filter(q => (q.q || '').toLowerCase().includes(searchQ) || (q.note || '').toLowerCase().includes(searchQ))
    : (activeCat >= 0 ? DATA[CATS[activeCat]].map((q, qi) => ({ ...q, cat: CATS[activeCat], ci: activeCat, qi, id: activeCat + '-' + qi })) : []);
  if (filter === 'mcq')     qs = qs.filter(isMCQ);
  if (filter === 'written') qs = qs.filter(isWritten);
  return qs;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderBrowse() {
  const qs  = getQs();
  const col  = COLORS[activeCat] || '#00b4d8';
  const icon = ICONS[activeCat]  || '📖';
  const name = activeCat >= 0 ? CATS[activeCat].replace(/^\d+\.\s*/, '') : 'Search Results';
  const mc   = qs.filter(isMCQ).length;
  const wr   = qs.filter(isWritten).length;

  const hdr = searchQ.length > 1
    ? `<div class="cat-hdr"><span class="cat-hdr-icon">🔍</span><div><div class="cat-hdr-title">Search Results</div><div class="cat-hdr-meta">${qs.length} questions matching "${esc(searchQ)}"</div></div></div>`
    : `<div class="cat-hdr" style="border-bottom-color:${col}">
        <span class="cat-hdr-icon">${icon}</span>
        <div><div class="cat-hdr-title" style="color:${col}">${esc(name)}</div>
        <div class="cat-hdr-meta">${qs.length} questions · MCQ: ${mc} · Written: ${wr}</div></div>
       </div>`;

  const pills = `<div class="pills">
    <button class="pill ${filter==='all'?'active':''}" onclick="setFilter('all')" ${filter==='all'?`style="background:${col};border-color:${col};"`:''}>All (${qs.length})</button>
    <button class="pill ${filter==='mcq'?'active':''}" onclick="setFilter('mcq')" ${filter==='mcq'?'style="background:#4895ef;border-color:#4895ef;"':''}>MCQ (${mc})</button>
    <button class="pill ${filter==='written'?'active':''}" onclick="setFilter('written')" ${filter==='written'?'style="background:#f7c948;border-color:#f7c948;"':''}>Written (${wr})</button>
  </div>`;

  const cards = qs.length === 0
    ? '<div class="empty">No questions found.</div>'
    : qs.map((q, i) => card(q, i, col)).join('');

  document.getElementById('browse-view').innerHTML = hdr + pills + cards;
}

function setFilter(f) { filter = f; renderBrowse(); }

function card(q, i, col) {
  const id   = q.id;
  const wr   = isWritten(q);
  const src  = q.src ? `<span class="q-tag tag-src">${esc(q.src)}</span>` : '';

  let body = '';
  if (!wr && q.opts) {
    const lets = ['a','b','c','d','e'];
    body += '<div class="opts-grid">' + q.opts.map((opt, oi) =>
      `<button class="opt-btn" data-let="${lets[oi]}" onclick="checkOpt(this,'${id}','${lets[oi]}','${esc(q.ans||'')}')">
        <span class="opt-let">${lets[oi].toUpperCase()}</span><span>${esc(opt)}</span>
      </button>`
    ).join('') + '</div>';
    const correctOpt = q.ans && q.opts ? esc(q.opts[['a','b','c','d','e'].indexOf(q.ans)] || '') : '';
    body += `<div class="ans-box" id="ans-${id}">
      <div class="ans-label">✓ Answer</div>
      <div class="ans-text">Option ${esc((q.ans||'').toUpperCase())}: ${correctOpt}</div>

  } else {
    body += `<button class="reveal-btn" onclick="revealAns('${id}')">Show Model Answer</button>

      <div class="ans-label">✓ Model Answer / Explanation</div>
      <div class="ans-text">${esc(q.note || '')}</div>
    </div>`;
  }

  if (q.note && !wr) {
    body += `<div class="note-box">
      <div class="note-label">📝 Note</div>
      <div class="note-text">${esc(q.note)}</div>
    </div>`;
  }

  return `<div class="q-card" id="card-${id}">
    <div class="q-hdr" onclick="toggleCard('${id}')">
      <div style="flex:1">
        <div class="q-num">Q${i+1} · ${esc(q.cat ? q.cat.replace(/^\d+\.\s*/,'') : '')}</div>
        <div class="q-text">${esc(q.q)}</div>
        <div class="q-tags">${ttag}${src}</div>
      </div>
      <span class="q-chev">▶</span>
    </div>
    <div class="q-body">${body}</div>
  </div>`;
}

function toggleCard(id) {
  const c = document.getElementById('card-' + id);
  if (c) c.classList.toggle('open');
}

function checkOpt(btn, id, letter, correct) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  card.querySelectorAll('.opt-btn').forEach(b => {
    b.onclick = null;
    if (b.dataset.let === correct) b.classList.add('correct');
    else b.classList.add('wrong');
  });
  if (letter !== correct) { btn.classList.remove('wrong'); btn.classList.add('wrong'); }
  const ab = document.getElementById('ans-' + id);
  if (ab) ab.classList.add('show');
}

function revealAns(id) {
  const ab = document.getElementById('ans-' + id);
  if (ab) ab.classList.add('show');
}

// ── QUIZ ──
function startQuiz() {
  const catQs = activeCat >= 0
    ? DATA[CATS[activeCat]].map((q, qi) => ({ ...q, ci: activeCat, qi, id: activeCat + '-' + qi })).filter(isMCQ)
    : ALL.filter(isMCQ);

  if (catQs.length === 0) {
    document.getElementById('quiz-view').innerHTML =
      '<div class="empty">No MCQ questions here. Use Browse mode for written questions.</div>';
    return;
  }
  const shuffled = [...catQs].sort(() => Math.random() - 0.5);
  quiz = { qs: shuffled, idx: 0, score: 0, wrong: 0, skipped: 0, done: false, ans: {} };
  renderQuiz();
}

function renderQuiz() {
  const qv = document.getElementById('quiz-view');
  if (!quiz) return;
  const { qs, idx, score, wrong, skipped, done } = quiz;
  const col = COLORS[activeCat] || '#00b4d8';

  if (done) {
    const pct = Math.round(score / qs.length * 100);
    document.getElementById('hdr-score').textContent = pct + '%';
    qv.innerHTML = `<div class="quiz-score">
      <h2 style="color:${col}">${pct}%</h2>
      <p>${qs.length} questions · ${activeCat >= 0 ? CATS[activeCat].replace(/^\d+\.\s*/,'') : 'All Categories'}</p>
      <div class="score-row">
        <div class="score-item"><div class="score-val c">${score}</div><div class="score-lbl">Correct</div></div>
        <div class="score-item"><div class="score-val w">${wrong}</div><div class="score-lbl">Wrong</div></div>
        <div class="score-item"><div class="score-val s">${skipped}</div><div class="score-lbl">Skipped</div></div>
      </div>
      <button class="retry-btn" onclick="startQuiz()">Retry</button>
    </div>`;
    return;
  }

  const q    = qs[idx];
  const lets = ['a','b','c','d','e'];
  const answered = quiz.ans[idx];

  const optsHtml = q.opts.map((opt, oi) => {
    const l = lets[oi];
    let cls = '';
    if (answered !== undefined) {
      if (l === q.ans) cls = ' correct';
      else if (l === answered) cls = ' wrong';
    }
    return `<button class="opt-btn${cls}" onclick="quizAns('${l}')" ${answered !== undefined ? 'disabled' : ''}>
      <span class="opt-let">${l.toUpperCase()}</span><span>${esc(opt)}</span>
    </button>`;
  }).join('');

  const noteHtml = answered !== undefined && q.note
    ? `<div class="note-box" style="margin-top:10px">
        <div class="note-label">📝 Explanation</div>
        <div class="note-text">${esc(q.note)}</div>
       </div>` : '';

  const pct = (idx / qs.length * 100).toFixed(1);

  qv.innerHTML = `<div class="quiz-wrap">
    <div class="quiz-prog">Q${idx+1}/${qs.length} · ✓ ${score} · ✗ ${wrong} · Skip ${skipped}</div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div>
    <div class="quiz-q">${esc(q.q)}</div>
    <div class="opts-grid">${optsHtml}</div>
    ${noteHtml}
    <div class="quiz-nav">
      <button class="qnav-btn" onclick="quizPrev()" ${idx===0?'disabled':''}>← Prev</button>
      ${answered !== undefined
        ? (idx === qs.length-1
            ? `<button class="qnav-btn primary" onclick="quizFinish()">Finish ✓</button>`
            : `<button class="qnav-btn primary" onclick="quizNext()">Next →</button>`)
        : `<button class="qnav-btn primary" onclick="quizSkip()">Skip</button>`
      }
    </div>
  </div>`;
}

function quizAns(l) {
  if (quiz.ans[quiz.idx] !== undefined) return;
  quiz.ans[quiz.idx] = l;
  if (l === quiz.qs[quiz.idx].ans) quiz.score++;
  else quiz.wrong++;
  renderQuiz();
}
function quizSkip() {
  if (quiz.ans[quiz.idx] !== undefined) return;
  quiz.ans[quiz.idx] = null; quiz.skipped++;
  quizNext();
}
function quizNext() {
  if (quiz.idx < quiz.qs.length - 1) { quiz.idx++; renderQuiz(); }
  else quizFinish();
}
function quizPrev() {
  if (quiz.idx > 0) { quiz.idx--; renderQuiz(); }
}
function quizFinish() {
  quiz.qs.forEach((_, i) => {
    if (quiz.ans[i] === undefined) { quiz.ans[i] = null; quiz.skipped++; }
  });
  quiz.done = true; renderQuiz();
}

// Init
buildSidebar();
renderBrowse();
</script>
